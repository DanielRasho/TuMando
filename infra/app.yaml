services:
  wud:
    image: getwud/wud
    container_name: wud
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "3004:3000"
    networks:
      - vpc
    environment:
      - WUD_WATCHER_LOCAL_SOCKET=/var/run/docker.sock
      - WUD_WATCHER_LOCAL_CRON=0 0 3 * * *  # Daily at 3 AM
      - WUD_TRIGGER_DOCKER_LOCAL_SOCKET=/var/run/docker.sock
      - WUD_TRIGGER_DOCKER_UPDATE_AUTO=false

  client:
    image: smaugtur/tucontrol-client:latest
    container_name: tumando-client
    restart: unless-stopped
    networks:
      - vpc
    environment:
      PORT: "3003"
    labels:
      - "wud.watch=true"
      - "wud.display.name=TuMando Client"
      - "wud.watch.digest=true"

  server:
    image: smaugtur/tucontrol-server:latest
    container_name: tumando-server
    restart: unless-stopped
    networks:
      - vpc
    labels:
      - "wud.watch=true"
      - "wud.display.name=TuMando Server"
      - "wud.watch.digest=true"
    environment:
      # API
      API_PORT: "8080"
      # DB
      DB_URI: "postgresql://postgres:postgres@tumando-db:5432/postgres"
      # LOGGING Configuration
      LOGGING_METHOD: "STDOUT"
      LOGGING_LEVEL: "debug"
      LOGGING_PRETTY: "yes"
      # CORS Configuration
      ALLOWED_ORIGINS: "https://tumando.thingys.top,http://localhost:3000,http://localhost:3001"
      ALLOWED_CONTENT_TYPES: "application/json,text/plain"
      ALLOWED_METHODS: "GET,POST,PUT,DELETE,PATCH"
      ALLOWED_HEADERS: "Content-Type,Authorization"

  db:
    image: smaugtur/tucontrol-db:latest
    container_name: tumando-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - vpc
    labels:
      - "wud.watch=false"

networks:
  vpc:
    external: true

volumes:
  postgres_data: