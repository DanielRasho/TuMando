services:
  wud:
    image: getwud/wud
    container_name: wud
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "3004:3000"
    networks:
      - vpc

  client:
    image: smaugtur/tucontrol-client:latest
    container_name: tumando-client
    restart: unless-stopped
    networks:
      - vpc
    environment: 
      PORT: "3003"
    labels:
      - "wud.watch=true"
      - "wud.display.name=TuMando Client"

  server:
    image: smaugtur/tucontrol-server:latest
    container_name: tumando-server
    restart: unless-stopped
    networks:
      - vpc
    labels:
      - "wud.watch=true"
      - "wud.display.name=TuMando Server"
    environment:
      # API
      API_PORT: "8080"
      # DB
      DB_URI: "postgresql://postgres:postgres@tumando-db:5432/postgres"
      # LOGGING Configuration
      LOGGING_METHOD: "STDOUT"
      LOGGING_LEVEL: "debug"
      LOGGING_PRETTY: "yes"
      # CORS Configuration
      ALLOWED_ORIGINS: "http://localhost:3001,http://localhost:3000,http://example.com"
      ALLOWED_CONTENT_TYPES: "application/json,text/plain"
      ALLOWED_METHODS: "GET,POST,PUT,DELETE,PATCH"
      ALLOWED_HEADERS: "Content-Type,Authorization"

  db:
    image: smaugtur/tucontrol-db:latest
    container_name: tumando-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - vpc
    labels:
      - "wud.watch=false"

networks:
  vpc:
    external: true

volumes:
  postgres_data: